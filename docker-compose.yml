################################################################################
#  P2P Zero-Trust Security Mesh — Docker Compose
#
#  Services:
#    coordinator   — HTTP REST peer registry + web dashboard (port 8090)
#    ollama        — Local LLM engine (port 11434)
#    ollama-init   — One-shot: pulls dolphin-llama3 model on first boot
#    node-{a..e}-ai  — Python AI sidecar per node
#    node-{a..e}-go  — Go peer node per node
#
#  Quick start:
#    docker compose up -d
#    open http://localhost:8090
#
#  Trigger attack on node-a:
#    nc localhost 2222
#
#  Scale up for load testing (add more nodes on the fly):
#    docker compose up -d --scale node-e-go=3 --scale node-e-ai=3
################################################################################

networks:
  mesh:
    driver: bridge

volumes:
  ollama_data:

# ─── Shared extension anchors ─────────────────────────────────────────────────
x-sidecar-base: &sidecar-base
  build:
    context: ./analyzer
    dockerfile: Dockerfile
  networks:
    - mesh
  environment:
    SIDECAR_PORT: "50052"
    OLLAMA_URL:   "http://ollama:11434"
    OLLAMA_MODEL: "dolphin-llama3"
  depends_on:
    ollama:
      condition: service_healthy
  restart: unless-stopped

x-node-base: &node-base
  build:
    context: .
    dockerfile: peer-node/Dockerfile
  networks:
    - mesh
  environment:
    P2P_PORT:        "9000"
    COORDINATOR_URL: "http://coordinator:8090"
    # Base environment sets default cert paths, which are overridden
    # by each node to point to their unique certs.
    CERT_FILE:       "/etc/certs/cert.pem"
    KEY_FILE:        "/etc/certs/key.pem"
    CA_FILE:         "/etc/certs/ca.pem"
  depends_on:
    coordinator:
      condition: service_healthy
  restart: unless-stopped

# ─── Coordinator ──────────────────────────────────────────────────────────────
services:
  coordinator:
    build:
      context: .
      dockerfile: coordinator/Dockerfile
    container_name: coordinator
    networks:
      - mesh
    ports:
      - "8090:8090"
    environment:
      COORDINATOR_PORT: "8090"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

# ─── Ollama LLM Engine ────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    networks:
      - mesh
    # GAP-10: No host port binding — Ollama is internal-only.
    # AI sidecars reach it via the mesh network as http://ollama:11434.
    # Exposing 11434 to the host would let any local process bypass the
    # sidecar's sanitization layer and query the LLM with unsanitized input.
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # One-shot service: pulls dolphin-llama3 on first boot, then exits.
  # Docker restarts=no so it only runs once per `docker compose up`.
  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    networks:
      - mesh
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Ollama to be ready..."
        until curl -sf http://ollama:11434/api/tags; do sleep 3; done
        echo "Pulling dolphin-llama3..."
        ollama pull dolphin-llama3
        echo "Model ready."
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

# ─── Node A ───────────────────────────────────────────────────────────────────
  node-a-ai:
    <<: *sidecar-base
    container_name: node-a-ai
    networks:
      mesh:
        aliases: [node-a-sidecar]

  node-a-go:
    <<: *node-base
    container_name: node-a-go
    ports:
      - "9001:9000"
      - "2222:2222"   # honeypot SSH — hit this to trigger an attack
    environment:
      NODE_ID:       "node-a"
      NODE_HOSTNAME: "node-a-go"
      P2P_PORT:      "9000"
      COORDINATOR_URL: "http://coordinator:8090"
      SIDECAR_ADDR:  "node-a-sidecar:50052"
      CERT_FILE:     "/etc/certs/node-a/cert.pem"
      KEY_FILE:      "/etc/certs/node-a/key.pem"
      CA_FILE:       "/etc/certs/ca.pem"
    depends_on:
      coordinator:
        condition: service_healthy
      node-a-ai:
        condition: service_started

# ─── Node B ───────────────────────────────────────────────────────────────────
