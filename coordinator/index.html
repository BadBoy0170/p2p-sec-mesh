<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Observability Flow | SOC Dashboard</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <!-- Top Navigation Bar -->
    <nav class="top-nav">
        <div class="nav-brand">
            <h1>Zero-Trust Topology Flow</h1>
        </div>
        <div class="nav-search">
            <input type="text" id="search-input" placeholder="🔍 Filter applications..." style="background: transparent; border: none; color: inherit; width: 100%; outline: none; font-family: inherit;">
        </div>
    </nav>

    <div class="app-container">
        <!-- Main Canvas (Left side) -->
        <main class="network-canvas" id="network-container"></main>

        <!-- Right Sidebar -->
        <aside class="sidebar">
            <header class="sidebar-header">
                <h2>Visibility</h2>
                <div class="sync-status" id="sync-indicator">
                    <span class="status-dot"></span> Live
                </div>
            </header>

            <div class="stats-container">
                <div class="stat-card">
                    <div class="stat-info">
                        <div class="stat-label">Applications Monitored</div>
                    </div>
                    <div class="stat-value large" id="stat-total">0</div>
                </div>

                <div class="stat-card">
                    <div class="stat-info">
                        <div class="stat-label">Healthy Streams</div>
                    </div>
                    <div class="stat-value text-success" id="stat-healthy">0</div>
                </div>

                <div class="stat-card">
                    <div class="stat-info">
                        <div class="stat-label">Active AI Detections</div>
                    </div>
                    <div class="stat-value text-warning" id="stat-threats">0</div>
                </div>

                <div class="stat-card">
                    <div class="stat-info">
                        <div class="stat-label">Quarantined Assets</div>
                    </div>
                    <div class="stat-value text-danger" id="stat-quarantined">0</div>
                </div>
            </div>
        </aside>
    </div>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
