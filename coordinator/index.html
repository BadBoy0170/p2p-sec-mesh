<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesh Topology · SOC</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Top Navigation Bar -->
    <nav class="top-nav">
        <div class="nav-brand">
            <h1>Zero-Trust Mesh</h1>
        </div>
        <div class="nav-search">
            <input type="text" id="search-input" placeholder="filter nodes...">
        </div>
    </nav>

    <div class="app-container">
        <!-- Main Canvas -->
        <main class="network-canvas" id="network-container"></main>

        <!-- Right Sidebar -->
        <aside class="sidebar">
            <header class="sidebar-header">
                <h2>Overview</h2>
                <div class="sync-status" id="sync-indicator">
                    <span class="status-dot"></span> live
                </div>
            </header>

            <div class="stats-container">
                <div class="stat-card">
                    <div class="stat-label">Nodes</div>
                    <div class="stat-value" id="stat-total">0</div>
                </div>

                <div class="stat-card">
                    <div class="stat-label">Healthy</div>
                    <div class="stat-value text-success" id="stat-healthy">0</div>
                </div>

                <div class="stat-card">
                    <div class="stat-label">Anomalies</div>
                    <div class="stat-value text-warning" id="stat-threats">0</div>
                </div>

                <div class="stat-card">
                    <div class="stat-label">Quarantined</div>
                    <div class="stat-value text-danger" id="stat-quarantined">0</div>
                </div>
            </div>

            <!-- AI Events Report Panel -->
            <div class="report-section">
                <div class="report-header">
                    <span>AI Events</span>
                    <span class="report-count" id="report-count">0</span>
                </div>
                <div class="report-feed" id="report-feed">
                    <div class="report-empty">no events yet</div>
                </div>
            </div>
        </aside>
    </div>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
